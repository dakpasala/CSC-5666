# Smoke test: tiny subset, few epochs. Verifies the pipeline runs end to end; results are meaningless.
# Reconstruction + KL only; separation guidance (pairs, invariance, amount prediction) is Checkpoint 4.
name: vae_smoke
data_config: configs/data.yaml
year: 2022
seed: 42
device: cpu                # cpu | mps | cuda | auto (cpu default for reproducibility)
output_dir: outputs/checkpoint3

data:
  n_train: 64
  n_val: 64

model:
  emb_dim: 16
  hidden_dim: 64
  num_layers: 1
  z_amount: 8
  z_timing: 16
  decoder_hidden: 128
  decoder_layers: 2
  n_harmonics: 4
  amount_head_hidden: 32

loss:
  beta_amount: 1.0
  beta_timing: 1.0
  lambda_invariance: 0.0
  lambda_amount: 0.0

train:
  epochs: 3
  batch_size: 32
  lr: 0.001
  kl_warmup_epochs: 0
  log_every: 1

eval:
  n_plot_examples: 8
  plot_seed: 11
